<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Flow</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --accent: #6ee7b7;
    --accent-dim: #2a4d3f;
    --break: #93c5fd;
    --break-dim: #2b3d55;
    --text: #e8e9ec;
    --text-dim: #8b8f99;
    --danger: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    text-align: center;
  }
  .mode-label {
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 8px;
    transition: color 0.3s;
  }
  .mode-label.break { color: var(--break); }
  .mode-label.work { color: var(--accent); }

  .timer-ring {
    position: relative;
    width: 240px;
    height: 240px;
    margin: 0 auto 24px;
  }
  .timer-ring svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: #22262f; stroke-width: 10; }
  .ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear, stroke 0.3s;
  }
  .ring-progress.break { stroke: var(--break); }

  .time-display {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 48px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  button {
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    font-family: inherit;
  }
  button:active { transform: scale(0.96); }
  .btn-primary {
    background: var(--accent);
    color: #0f1115;
    flex: 1;
  }
  .btn-primary.paused-look { background: var(--break); }
  .btn-secondary {
    background: #22262f;
    color: var(--text);
  }
  .btn-secondary:hover { background: #2a2f3a; }

  .stats-card {
    display: flex;
    justify-content: space-around;
    text-align: center;
  }
  .stat { display: flex; flex-direction: column; gap: 4px; }
  .stat-value { font-size: 24px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

  .log-card { text-align: left; }
  .log-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .log-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 160px;
    overflow-y: auto;
  }
  .log-item {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    padding: 8px 10px;
    background: #1d212a;
    border-radius: 8px;
  }
  .log-item .type { color: var(--accent); font-weight: 600; }
  .log-item.break-type .type { color: var(--break); }
  .log-item .when { color: var(--text-dim); font-size: 12px; }
  .log-empty { color: var(--text-dim); font-size: 14px; text-align: center; padding: 20px 0; }

  .settings-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .settings-row label {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .settings-row input {
    background: #22262f;
    border: 1px solid #2f3440;
    border-radius: 8px;
    color: var(--text);
    padding: 8px;
    font-size: 14px;
    width: 100%;
  }
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="mode-label work" id="modeLabel">Focus Session</div>
    <div class="timer-ring">
      <svg width="240" height="240">
        <circle class="ring-bg" cx="120" cy="120" r="105"></circle>
        <circle class="ring-progress" id="ringProgress" cx="120" cy="120" r="105"></circle>
      </svg>
      <div class="time-display" id="timeDisplay">25:00</div>
    </div>
    <div class="controls">
      <button class="btn-primary" id="startPauseBtn">Start</button>
      <button class="btn-secondary" id="resetBtn">Reset</button>
      <button class="btn-secondary" id="skipBtn">Skip</button>
    </div>
    <div class="settings-row">
      <label>Focus (min)
        <input type="number" id="workInput" min="1" max="120" value="25">
      </label>
      <label>Break (min)
        <input type="number" id="breakInput" min="1" max="60" value="5">
      </label>
    </div>
  </div>

  <div class="card stats-card">
    <div class="stat">
      <div class="stat-value" id="streakValue">0</div>
      <div class="stat-label">Streak</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="todayValue">0</div>
      <div class="stat-label">Today</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="totalValue">0</div>
      <div class="stat-label">All-time</div>
    </div>
  </div>

  <div class="card log-card">
    <div class="log-title">Session Log</div>
    <div class="log-list" id="logList">
      <div class="log-empty">No sessions yet — start your first focus block.</div>
    </div>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = 'focusFlow.sessions';
  const STREAK_KEY = 'focusFlow.streak';
  const LAST_DAY_KEY = 'focusFlow.lastDay';

  let workMinutes = 25;
  let breakMinutes = 5;
  let mode = 'work'; // 'work' | 'break'
  let secondsLeft = workMinutes * 60;
  let totalSeconds = workMinutes * 60;
  let running = false;
  let intervalId = null;

  const timeDisplay = document.getElementById('timeDisplay');
  const modeLabel = document.getElementById('modeLabel');
  const startPauseBtn = document.getElementById('startPauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const skipBtn = document.getElementById('skipBtn');
  const ringProgress = document.getElementById('ringProgress');
  const workInput = document.getElementById('workInput');
  const breakInput = document.getElementById('breakInput');
  const logList = document.getElementById('logList');
  const streakValue = document.getElementById('streakValue');
  const todayValue = document.getElementById('todayValue');
  const totalValue = document.getElementById('totalValue');

  const CIRC = 2 * Math.PI * 105;
  ringProgress.style.strokeDasharray = CIRC;

  function formatTime(s) {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const sec = (s % 60).toString().padStart(2, '0');
    return m + ':' + sec;
  }

  function updateDisplay() {
    timeDisplay.textContent = formatTime(secondsLeft);
    const progress = 1 - secondsLeft / totalSeconds;
    ringProgress.style.strokeDashoffset = CIRC * (1 - progress);
    ringProgress.classList.toggle('break', mode === 'break');
    modeLabel.textContent = mode === 'work' ? 'Focus Session' : 'Break Time';
    modeLabel.classList.toggle('work', mode === 'work');
    modeLabel.classList.toggle('break', mode === 'break');
    document.title = formatTime(secondsLeft) + ' — ' + (mode === 'work' ? 'Focus' : 'Break') + ' | Focus Flow';
  }

  function playChime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
      osc.start();
      osc.stop(ctx.currentTime + 0.8);
    } catch (e) { /* audio unavailable */ }
  }

  function getSessions() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) { return []; }
  }

  function saveSession(type) {
    const sessions = getSessions();
    sessions.push({ type, ts: Date.now() });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
    updateStreak(type);
    renderLog();
    renderStats();
  }

  function updateStreak(type) {
    if (type !== 'work') return;
    const today = new Date().toDateString();
    const lastDay = localStorage.getItem(LAST_DAY_KEY);
    let streak = parseInt(localStorage.getItem(STREAK_KEY) || '0', 10);
    if (lastDay === today) {
      // already counted today
    } else {
      const yesterday = new Date(Date.now() - 86400000).toDateString();
      streak = (lastDay === yesterday) ? streak + 1 : 1;
      localStorage.setItem(LAST_DAY_KEY, today);
      localStorage.setItem(STREAK_KEY, String(streak));
    }
  }

  function renderStats() {
    const sessions = getSessions().filter(s => s.type === 'work');
    const today = new Date().toDateString();
    const todayCount = sessions.filter(s => new Date(s.ts).toDateString() === today).length;
    streakValue.textContent = localStorage.getItem(STREAK_KEY) || '0';
    todayValue.textContent = todayCount;
    totalValue.textContent = sessions.length;
  }

  function renderLog() {
    const sessions = getSessions().slice(-15).reverse();
    if (sessions.length === 0) {
      logList.innerHTML = '<div class="log-empty">No sessions yet — start your first focus block.</div>';
      return;
    }
    logList.innerHTML = sessions.map(s => {
      const when = new Date(s.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const label = s.type === 'work' ? 'Focus' : 'Break';
      const cls = s.type === 'break' ? 'log-item break-type' : 'log-item';
      return `<div class="${cls}"><span class="type">${label}</span><span class="when">${when}</span></div>`;
    }).join('');
  }

  function tick() {
    secondsLeft--;
    if (secondsLeft < 0) {
      completeSession();
      return;
    }
    updateDisplay();
  }

  function completeSession() {
    saveSession(mode);
    playChime();
    mode = mode === 'work' ? 'break' : 'work';
    workMinutes = parseInt(workInput.value, 10) || 25;
    breakMinutes = parseInt(breakInput.value, 10) || 5;
    totalSeconds = (mode === 'work' ? workMinutes : breakMinutes) * 60;
    secondsLeft = totalSeconds;
    updateDisplay();
  }

  function start() {
    if (running) return;
    running = true;
    startPauseBtn.textContent = 'Pause';
    startPauseBtn.classList.add('paused-look');
    intervalId = setInterval(tick, 1000);
  }

  function pause() {
    running = false;
    startPauseBtn.textContent = 'Start';
    startPauseBtn.classList.remove('paused-look');
    clearInterval(intervalId);
  }

  function reset() {
    pause();
    mode = 'work';
    workMinutes = parseInt(workInput.value, 10) || 25;
    breakMinutes = parseInt(breakInput.value, 10) || 5;
    totalSeconds = workMinutes * 60;
    secondsLeft = totalSeconds;
    updateDisplay();
  }

  function skip() {
    pause();
    completeSession();
  }

  startPauseBtn.addEventListener('click', () => running ? pause() : start());
  resetBtn.addEventListener('click', reset);
  skipBtn.addEventListener('click', skip);
  workInput.addEventListener('change', () => { if (!running && mode === 'work') reset(); });
  breakInput.addEventListener('change', () => { if (!running && mode === 'break') { totalSeconds = (parseInt(breakInput.value,10)||5)*60; secondsLeft = totalSeconds; updateDisplay(); } });

  updateDisplay();
  renderLog();
  renderStats();
})();
</script>
</body>
</html>
